services:

  database:
    image: postgres:16
    container_name: bookmanager-db
    environment:
      POSTGRES_DB: bookmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: bookmanager-backend:latest
    container_name: bookmanager-backend
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bookmanager
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"

  frontend:
    image: bookmanager-frontend:latest
    container_name: bookmanager-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data: